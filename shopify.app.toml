# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4d61972862a38c319a8058f77c5c7d28"
name = "Variants Linked Products"
application_url = "https://linked-products.bluepeaks.top"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2024-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_metaobject_definitions,read_metaobject_definitions,write_metaobjects,read_metaobjects,read_themes"

[auth]
redirect_urls = [
  "https://linked-products.bluepeaks.top/auth/callback",
  "https://linked-products.bluepeaks.top/auth/shopify/callback",
  "https://linked-products.bluepeaks.top/api/auth/callback"
]
